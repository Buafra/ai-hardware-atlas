name: Update hardware and publish
on:
  push:
    branches: [main]
  # A new Android app release starts this workflow on main through android-release.yml (a release run itself runs on
  # its tag, which may not deploy the site).
  workflow_dispatch:
    inputs:
      ai:
        description: 'Also run the paid Claude steps (news summaries, translations, content-policy check, drafts)'
        type: boolean
        default: false
  schedule:
    # Twice a day, every 12 hours: UTC 22:07 / 10:07 = Dubai 02:07 / 14:07. Off the busy top and quarter of the hour,
    # when GitHub started the 03:15 / 15:15 slots 3.4 to 7.5 hours late; each run logs its start delay in
    # data/run-timing.json. Only these runs (or a manual run with "ai" ticked) call Claude; a push, a manual run or
    # an Android release only rebuilds the site.
    - cron: '7 22,10 * * *'

permissions:
  contents: read
concurrency:
  group: hardware-atlas-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The news step waits up to 20 minutes for its summary Message Batch, which is then left running and collected by a
    # later run. Headlines and the content check are asked directly (they must finish within the run).
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Always start from the latest main: a queued run must not work on the SHA that triggered it.
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Log how late this scheduled run started (data/run-timing.json, saved with the refreshed data)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/run_timing.py "$SCHEDULE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      # Restored before the first test: the test of the real release APK's signing certificate needs it (it is skipped
      # without it).
      - name: Restore the Android app (kept between runs, so a GitHub hiccup never drops the download)
        uses: actions/cache/restore@v4
        with:
          path: .cache/android
          key: android-apk-none
          restore-keys: |
            android-apk-
      - name: Test before the paid AI steps (a failing test stops the run before Claude is paid for)
        if: github.event_name == 'schedule' || inputs.ai
        run: |
          python -m unittest discover -s tests
          node tests/test-sort.cjs
      - name: Check official sources
        if: github.event_name != 'push'
        run: python scripts/refresh.py
      - name: Collect AI news (translations, summaries and the content-policy check need ANTHROPIC_API_KEY)
        if: github.event_name == 'schedule' || inputs.ai
        continue-on-error: true
        timeout-minutes: 100
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Each AI step sends its requests as one Message Batch: half the price of asking one at a time.
          NEWS_BATCH: '1'
          # Optional private report of removed stories (titles and reasons) to the owner; nothing is sent unless both are set.
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # WAM's RSS for registered users (full article text); the URLs hold the owner's access code.
          WAM_RSS_EN: ${{ secrets.WAM_RSS_EN }}
          WAM_RSS_AR: ${{ secrets.WAM_RSS_AR }}
        run: python scripts/news.py
      - name: Refresh OpenRouter model list and sizes
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/models.py
      - name: Draft records for new announcements (optional, needs ANTHROPIC_API_KEY)
        if: github.event_name == 'schedule' || inputs.ai
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read only: is the drafts' pull request still open (merged or closed drafts are not written again)?
          GH_TOKEN: ${{ github.token }}
        run: python scripts/draft.py
      # Again after the data changed (sources, news, models, drafts): nothing untested is saved or published.
      - name: Test catalog and safeguards
        run: |
          python -m unittest discover -s tests
          node tests/test-sort.cjs
      - name: Record configured schedule
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/catalog.json');d=json.loads(p.read_text(encoding='utf-8'))
          d['automation_status']='Configured in GitHub Actions'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Week of the news-image cache
        id: news-img-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore news images (company images are downloaded once, then kept here)
        uses: actions/cache/restore@v4
        with:
          path: .cache/news-img
          key: news-img-${{ steps.news-img-week.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-img-${{ steps.news-img-week.outputs.week }}-
            news-img-
      - name: Fetch the newest Android app release (checks size, SHA-256 and the signing certificate)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/android_app.py
      - name: Build website and PDF
        run: python scripts/build.py
      - name: Keep news images for the next run (saved even if a later step fails)
        if: always() && steps.news-img-week.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/news-img
          key: news-img-${{ steps.news-img-week.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the Android app for the next run (a new cache entry only when the APK changes)
        if: always() && hashFiles('.cache/android/latest.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/android
          key: android-apk-${{ hashFiles('.cache/android/latest.json') }}
      # Before the data is saved: a draft counts as done (data/draft-state.json) only once it is in a pull request.
      # Only when draft.py wrote drafts (pending ones, and those of a pull request still open, so the branch keeps them).
      # Pinned to the commit of v8.1.1 (the v8 tag), not a movable tag: this third-party action gets the write token.
      - name: Open a pull request for AI drafts
        id: drafts-pr
        if: github.event_name != 'push' && hashFiles('data/drafts/*.json') != ''
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: data/drafts/*.json
          branch: ai-drafts
          title: 'Review AI-drafted hardware records'
          commit-message: 'Add AI-drafted hardware records for review'
          body: |
            Drafted from newly discovered official announcements. Each file quotes the official page as evidence.
            Check every value against the source, then run `python scripts/draft.py --promote data/drafts/<file>.json` and commit. Merging this pull request alone does not change the public catalog.
      - name: Record whether the drafts pull request was opened (a failure is reported in the review issue)
        if: steps.drafts-pr.outcome == 'success' || steps.drafts-pr.outcome == 'failure'
        env:
          PR_OUTCOME: ${{ steps.drafts-pr.outcome }}
          PR_NUMBER: ${{ steps.drafts-pr.outputs.pull-request-number }}
        run: python scripts/draft.py --pr-result
      - name: Save refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data ':!data/drafts'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official hardware sources [skip ci]'
            # Another run or a manual push may have landed meanwhile; replay on top of it.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((attempt * 5))
            done
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          fi
      - name: Open or update the review issue
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/review_issue.py
      - name: Upload public website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Save refresh report
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: source-check-report
          path: data/refresh-report.json
          if-no-files-found: ignore
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
